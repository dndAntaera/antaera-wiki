site_name: Antaera Wiki
site_description: A reference wiki for the world of Antaera.
site_url: https://dndantaera.github.io/antaera-wiki/

theme:
  name: material
  language: en
  icon:
    logo: material/book-open-page-variant
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

extra_css:
  # Tokens first: extra.css is written entirely in terms of them.
  - stylesheets/tokens.css
  - stylesheets/extra.css

extra_javascript:
  - javascripts/starfield.js

hooks:
  - hooks/archived.py
  - hooks/flags.py
  - hooks/tablenotes.py
  - hooks/cachebust.py

plugins:
  - search
  - tags
  - git-revision-date-localized:
      enable_creation_date: true
      fallback_to_build_date: true
      # A page that is not committed yet has no git log. That is normal while
      # drafting; it should not fail the build the way a broken link should.
      strict: false

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - pymdownx.smartsymbols
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# A curated sidebar, matching the navigation this wiki had on Wikidot.
#
# Listing pages here makes the nav explicit: pages NOT listed still build, and
# stay reachable by search and by links from other pages, but they no longer
# appear in the sidebar. That is the same trade the old nav_side page made.
nav:
  - Main Page: index.md
  - Character Creation: character-creation.md
  - The Index: the-index.md
  - The Pantheons: pantheons.md
  - The Cosmology: cosmology.md
  - The Known Spheres: spelljamming/known-spheres.md
  - Taxonomies: taxonomy-main.md
  - Antæran Calendar: calendar.md
  - Spelljamming: spelljamming/main.md
  - Disclaimer: disclaimer.md
