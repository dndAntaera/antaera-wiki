# Pages CMS - browser-based editing for the Antaera Wiki.
# https://pagescms.org  |  Edit at app.pagescms.org
#
# Saving commits to main; CI rebuilds and the live site updates in ~40s.
#
# One collection covering the whole docs tree. Create whatever structure you
# want inside it - MkDocs builds the navigation from the folders and titles it
# finds, so nothing here needs changing when you add a page or a section.

media:
  input: docs/img
  output: /antaera-wiki/img
  extensions: [png, jpg, jpeg, gif, svg, webp]

content:
  - name: pages
    label: Pages
    type: collection
    path: docs
    format: yaml-frontmatter
    filename: "{primary}.md"
    subfolders: true
    exclude:
      - img
      - stylesheets
    view:
      primary: title
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: tags
        label: Tags
        type: select
        options:
          creatable: true
          multiple: true
      - name: body
        label: Content
        type: rich-text
